[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biped"
version = "0.1.0"
description = "Biped robot simulation and control using MuJoCo"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.10,<4",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
managed = true
